name: bumil-safe build

on:
  push:
    branches: [main]
    paths: ["bumil-safe/**", ".github/workflows/bumil-safe.yml"]
  pull_request:
    paths: ["bumil-safe/**", ".github/workflows/bumil-safe.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bumil-safe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bumil-safe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
