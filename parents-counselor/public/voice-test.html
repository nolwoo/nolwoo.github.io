<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 입력 테스트</title>
<style>
  body {
    font-family: "Apple SD Gothic Neo", sans-serif;
    max-width: 500px; margin: 0 auto; padding: 40px 20px;
    background: #f5f6f8; color: #16202e;
  }
  h2 { font-size: 20px; margin-bottom: 8px; }
  p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
  button {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    font-size: 17px; font-weight: 700; cursor: pointer;
    font-family: inherit; margin-bottom: 16px;
  }
  #btn-start { background: #1e3a5f; color: #fff; }
  #btn-start:disabled { background: #94a3b8; }
  #btn-stop { background: #ef4444; color: #fff; display: none; }
  #status {
    padding: 14px 16px; border-radius: 10px;
    background: #fff; border: 1px solid #e3e7ed;
    font-size: 14px; min-height: 60px; color: #16202e;
    line-height: 1.6; margin-bottom: 16px;
  }
  .tag {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; margin-bottom: 12px;
  }
  .tag.ok { background: #d1fae5; color: #065f46; }
  .tag.fail { background: #fee2e2; color: #991b1b; }
  .tag.wait { background: #fef3c7; color: #92400e; }
  #info { font-size: 12px; color: #94a3b8; margin-top: 20px; word-break: break-all; }
</style>
</head>
<body>
<h2>🎤 음성 입력 테스트</h2>
<p>이 페이지에서 마이크 버튼을 누르고 한국어로 말해보세요.<br>음성이 텍스트로 변환되면 성공입니다.</p>

<div id="support-tag" class="tag wait">확인 중…</div>

<div id="status">여기에 인식된 말이 표시됩니다.</div>

<button id="btn-start">🎤 말하기 시작</button>
<button id="btn-stop">⏹ 중지</button>

<div id="info"></div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const tag = document.getElementById('support-tag');
const status = document.getElementById('status');
const btnStart = document.getElementById('btn-start');
const btnStop = document.getElementById('btn-stop');
const info = document.getElementById('info');

// 브라우저/기기 정보
info.textContent = navigator.userAgent;

if (!SpeechRecognition) {
  tag.textContent = '❌ 이 브라우저는 음성 입력을 지원하지 않습니다';
  tag.className = 'tag fail';
  btnStart.disabled = true;
  status.textContent = 'Web Speech API를 지원하지 않는 브라우저입니다. Safari나 Chrome에서 시도해보세요.';
} else {
  tag.textContent = '✅ 음성 입력 API 지원됨 — 버튼을 눌러 테스트';
  tag.className = 'tag ok';

  const rec = new SpeechRecognition();
  rec.lang = 'ko-KR';
  rec.continuous = true;
  rec.interimResults = true;

  rec.onstart = () => {
    status.textContent = '🔴 듣는 중… 말해보세요.';
    btnStart.style.display = 'none';
    btnStop.style.display = 'block';
  };

  rec.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    status.textContent = (final || interim) || '…';
    if (final) {
      status.style.background = '#d1fae5';
      tag.textContent = '✅ 성공! 음성 → 텍스트 변환 작동함';
      tag.className = 'tag ok';
    }
  };

  rec.onerror = (e) => {
    status.textContent = `오류: ${e.error}`;
    tag.textContent = `❌ 오류 발생: ${e.error}`;
    tag.className = 'tag fail';
    btnStart.style.display = 'block';
    btnStop.style.display = 'none';
  };

  rec.onend = () => {
    btnStart.style.display = 'block';
    btnStop.style.display = 'none';
    if (!status.textContent.includes('오류') && status.textContent !== '여기에 인식된 말이 표시됩니다.') {
      status.textContent += '\n\n[인식 종료]';
    }
  };

  btnStart.addEventListener('click', () => {
    status.style.background = '#fff';
    status.textContent = '마이크 권한 요청 중…';
    try { rec.start(); } catch(e) { status.textContent = '이미 실행 중입니다. 중지 후 다시 시도하세요.'; }
  });

  btnStop.addEventListener('click', () => rec.stop());
}
</script>
</body>
</html>
